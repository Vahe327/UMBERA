<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Sealed sender flow">
<defs>
<radialGradient id="glow" cx="80%" cy="0%" r="90%"><stop offset="0" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#0b0a10" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#6aa0ff"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9b7bff"/></marker>
</defs>
<rect width="960" height="380" rx="18" fill="#0b0a10"/>
<rect width="960" height="380" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="959" height="379" rx="18" fill="none" stroke="#2c2838"/>
<text x="36" y="46" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6f6c80">SEALED SENDER, HYBRID POST-QUANTUM</text><text x="36" y="76" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f1f6">The sender's identity travels inside the ciphertext. The relay sees neither sender nor recipient.</text><rect x="36" y="110" width="164" height="74" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="118.0" y="141.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">1. Ratchet</text><text x="118.0" y="161.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">encrypt message</text><line x1="200" y1="147" x2="218" y2="147" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="218" y="110" width="164" height="74" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="300.0" y="141.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">2. Inner package</text><text x="300.0" y="161.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">sender + ratchet msg</text><line x1="382" y1="147" x2="400" y2="147" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="400" y="110" width="164" height="74" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="482.0" y="141.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">3. Seal</text><text x="482.0" y="161.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">X25519 + Kyber</text><line x1="564" y1="147" x2="582" y2="147" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="582" y="110" width="164" height="74" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="664.0" y="141.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">4. Pad</text><text x="664.0" y="161.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">size buckets</text><line x1="746" y1="147" x2="764" y2="147" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="764" y="110" width="164" height="74" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="846.0" y="141.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">5. Deliver</text><text x="846.0" y="161.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">rendezvous ID</text><rect x="36" y="214" width="888" height="132" rx="14" fill="#120f19" stroke="#2c2838"/><text x="60" y="246" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f1f6">Seal key derivation</text><text x="60" y="274" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">ss₁ = X25519(eph_priv, recipient_x25519)       ss₂ = ML-KEM-1024 (Kyber).Encaps(recipient_kyber)</text><text x="60" y="298" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">k   = HKDF-SHA256(ss₁ ‖ ss₂, salt = HYBRID_LABEL, info = "key-derivation", 64)[0..32]</text><text x="60" y="322" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">box = AES-256-GCM(k, iv₁₂, inner)  →  { ephemeralPublicKey, kyberCiphertext, iv, encryptedInner, authTag }</text>
</svg>