<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="How calls are encrypted">
<defs><radialGradient id="glow" cx="80%" cy="0%" r="90%"><stop offset="0" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#0b0a10" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#6aa0ff"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9b7bff"/></marker></defs>
<rect width="960" height="450" rx="18" fill="#0b0a10"/><rect width="960" height="450" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="959" height="449" rx="18" fill="none" stroke="#2c2838"/>
<text x="36" y="46" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6f6c80">CALLS</text><text x="36" y="76" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f1f6">Call keys are created on the two phones. The relay forwards encrypted packets it cannot open.</text><rect x="36" y="140" width="200" height="80" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="136.0" y="174.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Alice's phone</text><text x="136.0" y="194.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#a9a6b8">creates call keys</text><rect x="380" y="140" width="200" height="80" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="480.0" y="174.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Relay</text><text x="480.0" y="194.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#a9a6b8">forwards ciphertext</text><rect x="724" y="140" width="200" height="80" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="824.0" y="174.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Bob's phone</text><text x="824.0" y="194.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#a9a6b8">creates call keys</text><text x="308" y="124" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#8f8ba3">SRTP (encrypted)</text><text x="652" y="124" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#8f8ba3">SRTP (encrypted)</text><line x1="240" y1="168" x2="376" y2="168" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><line x1="376" y1="192" x2="240" y2="192" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><line x1="584" y1="168" x2="720" y2="168" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><line x1="720" y1="192" x2="584" y2="192" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="36" y="244" width="888" height="176" rx="14" fill="#120f19" stroke="#2c2838"/><text x="60" y="276" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f1f6">Why nobody in the middle can listen</text><text x="60" y="306" xml:space="preserve" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">1. Audio and video are encrypted with DTLS-SRTP directly between the two phones.</text><text x="60" y="328" xml:space="preserve" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">2. The keys never leave the phones. The relay and the network see only encrypted packets.</text><text x="60" y="350" xml:space="preserve" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">3. Call setup (SDP and key fingerprints) is end-to-end encrypted and signed by the caller,</text><text x="60" y="372" xml:space="preserve" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">   then delivered through the same anonymous channel as messages.</text><text x="60" y="394" xml:space="preserve" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">4. The server cannot read or change call setup, so it cannot slip itself in as a middleman.</text></svg>