<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="Umbera architecture">
<defs>
<radialGradient id="glow" cx="80%" cy="0%" r="90%"><stop offset="0" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#0b0a10" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#6aa0ff"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9b7bff"/></marker>
</defs>
<rect width="960" height="450" rx="18" fill="#0b0a10"/>
<rect width="960" height="450" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="959" height="449" rx="18" fill="none" stroke="#2c2838"/>
<text x="36" y="46" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6f6c80">ARCHITECTURE</text><text x="36" y="76" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f1f6">Everything sensitive happens on the device. The relay only moves opaque, padded blobs.</text><rect x="36" y="104" width="560" height="64" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="316.0" y="130.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Umbera apps</text><text x="316.0" y="150.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a6b8">Android · iOS</text><line x1="316" y1="168" x2="316" y2="196" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="36" y="200" width="560" height="92" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="316.0" y="240.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Protocol layer (Kotlin Multiplatform)</text><text x="316.0" y="260.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">sealed sender · double ratchet · files · rendezvous · key transparency</text><line x1="316" y1="292" x2="316" y2="320" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="36" y="324" width="560" height="92" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="316.0" y="364.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">umbera-core (Rust)</text><text x="316.0" y="384.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">Kyber · Dilithium · X25519 · Ed25519 · AES-GCM · HKDF · MLS · AMF</text><rect x="636" y="104" width="288" height="312" rx="14" fill="#120f19" stroke="#2c2838" stroke-dasharray="5 5"/><text x="780" y="136" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f2f1f6">Blind relay</text><text x="660" y="172" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#5fd3a1">Sees</text><text x="660" y="196" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">+ opaque rendezvous IDs</text><text x="660" y="218" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">+ padded ciphertext</text><text x="660" y="240" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">+ delivery timestamps</text><text x="660" y="284" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ff7a7a">Never sees</text><text x="660" y="308" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">– sender identity</text><text x="660" y="330" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">– who talks to whom</text><text x="660" y="352" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">– message content</text><text x="660" y="374" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#a9a6b8">– group membership</text><line x1="596" y1="250" x2="632" y2="250" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>