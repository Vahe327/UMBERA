<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-label="Rendezvous addressing">
<defs>
<radialGradient id="glow" cx="80%" cy="0%" r="90%"><stop offset="0" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#0b0a10" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#6aa0ff"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9b7bff"/></marker>
</defs>
<rect width="960" height="372" rx="18" fill="#0b0a10"/>
<rect width="960" height="372" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="959" height="371" rx="18" fill="none" stroke="#2c2838"/>
<text x="36" y="46" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6f6c80">RENDEZVOUS ADDRESSING</text><text x="36" y="76" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f2f1f6">Mailbox addresses are derived by both peers independently and rotate every week.</text><rect x="36" y="104" width="250" height="70" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="161.0" y="133.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Alice</text><text x="161.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">x25519 private a</text><rect x="674" y="104" width="250" height="70" rx="12" fill="#15131d" stroke="#2c2838" stroke-width="1.2"/><text x="799.0" y="133.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Bob</text><text x="799.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">x25519 private b</text><rect x="330" y="104" width="300" height="70" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="480.0" y="133.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Shared secret</text><text x="480.0" y="153.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">X25519(a, B) = X25519(b, A)</text><line x1="286" y1="139" x2="326" y2="139" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><line x1="674" y1="139" x2="634" y2="139" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><line x1="480" y1="174" x2="480" y2="206" stroke="#9b7bff" stroke-width="1.6" marker-end="url(#ar)"/><rect x="196" y="210" width="568" height="74" rx="12" fill="#15131d" stroke="url(#acc)" stroke-width="1.6"/><text x="480.0" y="241.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f2f1f6">Rendezvous ID</text><text x="480.0" y="261.0" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#a9a6b8">HKDF(shared, RENDEZVOUS_LABEL, "rdv|e{epoch}|{from}|{to}")</text><text x="480" y="316" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">epoch = ⌊unix_time / 7 days⌋ · receivers poll the current and previous epoch</text><text x="480" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#a9a6b8">reads are authorised by an Ed25519 proof derived from the X25519 key — no account identifier is sent</text>
</svg>