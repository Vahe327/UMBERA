 Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#a9a6b8">AES-256-GCM, 96-bit nonces</text><rect x="754" y="185" width="150" height="22" rx="11" fill="none" stroke="url(#acc)"/><text x="829" y="201" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9b7bff">AEAD</text><rect x="36" y="224" width="888" height="44" rx="10" fill="#110f18"/><text x="56" y="252" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f1f6">Key derivation</text><text x="290" y="252" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#a9a6b8">HKDF-SHA256, Argon2id, PBKDF2</text><rect x="754" y="235" width="150" height="22" rx="11" fill="none" stroke="url(#acc)"/><text x="829" y="251" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9b7bff">KDF</text><rect x="36" y="274" width="888" height="44" rx="10" fill="#15131d"/><text x="56" y="302" text-anchor="start" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2f1f6">1:1 sessions</text><text x="290" y="302" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#a9a6b8">Double Ratchet over X25519</text><rect x="754" y="285" width="150" height="22" rx="11" fill="none" stroke="url(#acc)"/><text x="829" y="301" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#9b7bff">forward secrecy</text><rect x="36" y="324" width="888" height="44" rx="10" fill="#110f18"/><text x="56" y="352" text-anchor="start" font-family="In